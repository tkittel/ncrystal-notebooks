################################################################################
#                                                                              #
# Settings for the NCrystal notebooks, used by devel/bin/ncnotebookdevtool.    #
#                                                                              #
# Each notebook declares its title, shortkey, section and requirements in its  #
# first cell (the "settings cell"), using the sections and requirements        #
# defined here. The tool turns this into the actual installation and setup    #
# code needed in a given context (testing, Google Colab, downloads, ...).      #
#                                                                              #
################################################################################

[general]

# Minimum NCrystal version, checked when the notebooks run:
ncrystal_min_version = "4.4.6"

# Maximum length of lines in code cells (a notebook can declare a different
# value in its settings cell):
max_line_length = 120

# Code cells with more lines than this are shown collapsed on the website and
# in the notebooks for users (unless tagged "show-input"). Shorter cells can be
# collapsed by tagging them "hide-input":
hide_input_lines = 60

# Time limits (in seconds) for running a notebook, from the start to the end of
# its execution. The limits for tests apply when notebooks are tested (with
# their test-parameters, if any), and the limits for full runs when the website
# is built (as users would run them). Notebooks exceeding these fail.
#
# Notebooks should run in less than 20 s, and those taking more than 25 s
# should be marked as slow. Slow notebooks have separate limits, but fail if
# their full runs take less than min_full_time_slow (so the mark is removed
# when no longer needed; this is not checked in tests, where test-parameters
# can make them faster). The limits for slow notebooks are
# about twice the slowest times seen (244 s and 432 s), and should be lowered
# when the slowest notebooks are made faster:
max_test_time = 40
max_full_time = 40
max_test_time_slow = 500
max_full_time_slow = 900
min_full_time_slow = 10

# On Windows, the limits for notebooks not marked as slow (max_test_time and
# max_full_time) are multiplied by this factor, since some things (e.g.
# compilation of McStas instruments) take much longer there:
windows_time_factor = 2

# GitHub repository, the branch with the Google Colab versions of the
# notebooks, and the website:
github_repo = "mctools/ncrystal-notebooks"
colab_branch = "googlecolab"
website_url = "https://mctools.github.io/ncrystal-notebooks"

################################################################################
# Sections, in the order they are shown on the website. Each notebook declares
# the key of its section in its settings cell.

[[sections]]
key = "basics"
title = "Basic introduction to NCrystal"
description = """Start here, to get a solid foundation and learn about the \
basic NCrystal objects and what they provide."""

[[sections]]
key = "materials"
title = "Creating new materials"
description = """For people wishing to create new material definitions, from \
the basic ingredients to crystal structures and phonons."""

[[sections]]
key = "misc"
title = "Miscellaneous"
description = "Notebooks about specific features and applications."

[[sections]]
key = "nd2025"
title = "Contributed: ND2025 conference"
description = """Notebooks from the International Conference on Nuclear Data \
for Science and Technology (ND2025)."""

[[sections]]
key = "neuwave12"
title = "Contributed: NEUWAVE-12 workshop"
description = "Exercises from the NEUWAVE-12 workshop."

################################################################################
# Requirements, which notebooks declare in their settings cell (NCrystal itself
# is always required). The fields are:
#
#   description : short description (shown on the website and in listings).
#   pip         : packages to install with pip.
#   conda       : packages to install with conda (from conda-forge). They can
#                 be restricted to some platforms with a marker, as in
#                 "openmpi; sys_platform != 'win32'".
#   conda_pip   : packages to install with pip, also in conda environments
#                 (e.g. packages not available on conda-forge).
#   local       : packages which, when testing or developing, are installed
#                 from a directory in this repository instead.
#   setup       : Python code added to the setup of the notebook.
#   colab_setup : Python code added to the setup of the notebook on Google
#                 Colab only.
#   conda_platforms : conda platforms (e.g. "linux-64") on which the conda
#                 packages exist, if not all. Notebooks needing the requirement
#                 are not tested on other platforms.
#
# A requirement without "pip" packages is only available with conda, and
# notebooks needing it are therefore only tested in conda environments.

[requirements.ncrystal]
description = "NCrystal"
pip = ["ncrystal"]
conda = ["ncrystal"]

[requirements.plot]
description = "matplotlib"
pip = ["ncrystal[plot]", "ipympl"]
conda = ["matplotlib", "ipympl"]

[requirements.widgets]
description = "Jupyter widgets"
pip = ["ipywidgets"]
conda = ["ipywidgets"]

# NCrystal's own packages are used for optional dependencies of NCrystal, so
# NCrystal controls their versions. On conda-forge, ncrystal-extra has gemmi and
# spglib, and only ncrystal-all also has ASE (and endf-parserpy).
[requirements.cif]
description = "CIF file support (gemmi, spglib)"
pip = ["ncrystal[cif]"]
conda = ["ncrystal-extra"]
colab_setup = """
#Avoid warnings later on Google Colab (cf. mctools/ncrystal#192):
import gemmi
import spglib
"""

[requirements.ase]
description = "ASE"
pip = ["ncrystal[cif]"]
conda = ["ncrystal-all"]

[requirements.endf]
description = "ENDF support (endf-parserpy)"
pip = ["ncrystal[endf]"]
conda = ["ncrystal-all"]

[requirements.pandas]
description = "pandas"
pip = ["pandas"]
conda = ["pandas"]

[requirements.tqdm]
description = "tqdm"
pip = ["tqdm"]
conda = ["tqdm"]

[requirements.utils]
description = "NCrystal notebook utilities"
# TEMPORARY: requests is listed since ncrystal-notebook-utilities 0.0.2 on PyPI
# does not declare it as a dependency (fixed in 0.0.3, not released yet):
pip = ["ncrystal-notebook-utilities", "requests"]
conda = ["requests"]
conda_pip = ["ncrystal-notebook-utilities"]
local = { ncrystal-notebook-utilities = "utilities" }

[requirements.openmc]
description = "OpenMC"
conda = ["openmc"]
# Platforms on which conda-forge has OpenMC (notebooks needing it are skipped
# elsewhere):
conda_platforms = ["linux-64", "osx-64"]

[requirements.njoy]
description = "NJOY2016"
conda = ["njoy2016"]
conda_platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[requirements.mcstas]
description = "McStas"
#McStas compiles with MPI by default (and fails if MPI is missing). On Windows
#this is Microsoft MPI (conda-forge only has an old placeholder package of
#openmpi there):
conda = ["mcstas-core", "openmpi; sys_platform != 'win32'",
         "msmpi; sys_platform == 'win32'"]
setup = """
#Let McStas find its resources:
import os
import shutil
import subprocess
if 'MCSTAS' not in os.environ:
    os.environ['MCSTAS'] = subprocess.run(
        [shutil.which('mcrun') or 'mcrun','--showcfg=resourcedir'],
        capture_output=True, check=True
    ).stdout.decode().strip()
"""
colab_setup = """
import pathlib
os.environ['CONDA_PREFIX'] = str(pathlib.Path(shutil.which('nctool')).parent.parent)
"""

################################################################################
# NCrystal plugins, which notebooks declare in the "plugins" line of their
# settings cell. The value is the pip requirement used to install the plugin
# (also in conda environments). They are installed before NCrystal is imported,
# so NCrystal finds them.

[plugins]
CrysText = "ncrystal-plugin-CrysText @ git+https://github.com/highness-eu/ncplugin-CrysText"
CrysExtn = "ncrystal-plugin-CrysExtn @ git+https://github.com/XuShuqi7/ncplugin-CrysExtn"
WaterData = "ncrystal-plugin-WaterData"
