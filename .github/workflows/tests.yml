name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '30 11 * * 2'  # 11:30 every Tuesday
  workflow_dispatch:

jobs:

  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    name: Quick checks and tool tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Quick checks of all notebooks
      run: python devel/bin/ncnotebookdevtool check
    #(ruff is limited to 0.16.x, since new minor versions can add rules, which
    #should not make CI fail unexpectedly. Update it deliberately.)
    - name: Install pytest and ruff
      run: python -m pip install pytest "ruff>=0.16.10,<0.17"
    - name: Lint the Python code and the notebooks
      run: python devel/bin/ncnotebookdevtool lint
    - name: Tests of ncnotebookdevtool
      run: python -m pytest -v devel/tests

  pip:
    needs: [ checks ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: macos-latest,  python: '3.12' }
          - { os: windows-latest, python: '3.12' }
    name: Notebooks with pip (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}
    #Microsoft's C compiler, for notebooks compiling code (e.g. McStas
    #instruments with mccode-antlr):
    - uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2.2
      if: runner.os == 'Windows'
    #Notebooks marked as slow are run by the tests_slow workflow instead:
    - name: Run notebooks installable with pip
      run: python devel/bin/ncnotebookdevtool test --select pip --env venv --skip-slow -j 3 --workdir "${{ runner.temp }}/work"
    - name: Upload logs of failed notebooks
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failed-pip-${{ matrix.os }}-${{ matrix.python }}
        path: |
          ${{ runner.temp }}/work/*.log
          ${{ runner.temp }}/work/*/*.executed.ipynb

  conda:
    needs: [ checks ]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    name: Notebooks with conda (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
    - name: Cache data downloaded by notebooks
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ncnbdata
        key: ncnb-data-v1-${{ runner.os }}
    #Notebooks marked as slow are run by the tests_slow workflow instead:
    - name: Run notebooks needing conda
      env:
        NCRYSTAL_NOTEBOOK_DATA_CACHE: ${{ runner.temp }}/ncnbdata
      run: python devel/bin/ncnotebookdevtool test --select conda --env conda --skip-slow -j 2 --workdir "${{ runner.temp }}/work"
    - name: Upload logs of failed notebooks
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failed-conda-${{ matrix.os }}
        path: |
          ${{ runner.temp }}/work/*.log
          ${{ runner.temp }}/work/*/*.executed.ipynb
