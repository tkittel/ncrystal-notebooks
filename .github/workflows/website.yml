name: website

# Runs all notebooks, builds the website and publishes it on GitHub Pages
# (which must be configured to be deployed by GitHub Actions), and pushes the
# versions of the notebooks for Google Colab to the googlecolab branch.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'  # 04:30 every Monday
  workflow_dispatch:

permissions:
  contents: write  # for pushing the googlecolab branch
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
    - name: Cache data downloaded by notebooks
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ncnbdata
        key: ncnb-data-v1-${{ runner.os }}
    #(GitHub's runners have 4 cores:)
    - name: Run notebooks and build website
      env:
        NCNOTEBOOKDEVTOOL_GITHUB_REPO: ${{ github.repository }}
        NCRYSTAL_NOTEBOOK_DATA_CACHE: ${{ runner.temp }}/ncnbdata
      run: ./devel/bin/ncnotebookdevtool site -j 4 -o "${{ runner.temp }}/site" --workdir "${{ runner.temp }}/work"
    - name: Upload logs of failed notebooks
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failed-website
        path: ${{ runner.temp }}/work/*.log
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ runner.temp }}/site/html
    - name: Push Google Colab versions of the notebooks to the googlecolab branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eux
        cd "${{ runner.temp }}/site/colab"
        printf '%s\n' "Versions of the notebooks for Google Colab, generated from" \
          "${GITHUB_SHA} by the website workflow (do not edit)." > README.md
        git init -q -b googlecolab
        git add .
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Google Colab versions of the notebooks (from ${GITHUB_SHA})"
        git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" googlecolab

  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
