name: colab

# Runs the Colab versions of the notebooks (with their installation cells) in
# Google's Colab runtime image, i.e. with the same Python and preinstalled
# packages as on Google Colab, to catch problems like failing installations or
# version conflicts there. Each notebook runs in its own fresh container, as
# on Colab, where every notebook starts in a fresh runtime (so what one
# notebook installs can not hide a missing requirement of another). It does
# not test Colab itself (e.g. its user interface). Notebooks needing conda
# install it with condacolab, after which the kernel is restarted, as on Colab.
#
# The image is large (about 7 GB compressed). All notebooks run on every push:
# the normal ones together in one job, and each slow one in its own job, all in
# parallel, so that the slow ones do not add up.

on:
  push:
  schedule:
    - cron: '30 11 * * 3'  # 11:30 every Wednesday
  workflow_dispatch:

env:
  COLAB_IMAGE: us-docker.pkg.dev/colab-images/public/cpu-runtime:latest

jobs:

  #The jobs of the colab job below: one for the normal notebooks, and one for
  #each slow notebook (as selected by the tool):
  select:
    name: Select the jobs
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Select the jobs
      id: select
      run: |
        python3 devel/bin/ncnotebookdevtool test --colab --only-slow \
          --write-selected slow.txt
        python3 - <<'EOF' >> "$GITHUB_OUTPUT"
        import json, pathlib
        include = [ { 'name' : 'Notebooks', 'key' : 'normal',
                      'select' : '--skip-slow' } ]
        for sk in pathlib.Path('slow.txt').read_text().split():
            include.append( { 'name' : f'Slow notebook {sk}', 'key' : sk,
                              'select' : sk } )
        print( 'include=' + json.dumps(include) )
        EOF
        cat "$GITHUB_OUTPUT"

  colab:
    name: ${{ matrix.name }} in the Colab runtime image
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    #The image needs about 30 GB (20 GB unpacked, plus the download). The
    #runners usually have much more free space, so only if not, space is freed
    #by removing large preinstalled tools (which takes about 2 minutes):
    - name: Check the free disk space
      run: |
        df -h /
        avail=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
        if [ "$avail" -lt 40 ]; then
          echo "Only $avail GB free, freeing space"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
        fi
    - name: Pull the Colab runtime image
      run: |
        time docker pull --quiet "$COLAB_IMAGE"
        docker image inspect "$COLAB_IMAGE" \
          --format 'Size: {{.Size}} bytes, created {{.Created}}'
    - name: Cache data downloaded by notebooks
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ncnbdata
        key: ncnb-data-colab-v1
    #Each notebook runs in its own fresh container (see the script):
    - name: Run notebooks in the Colab runtime image
      run: |
        bash .github/scripts/colab-test.sh "$COLAB_IMAGE" \
          "${{ runner.temp }}/work" "${{ runner.temp }}/ncnbdata" 2 \
          ${{ matrix.select }}
    - name: Upload logs of failed notebooks
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failed-colab-${{ matrix.key }}
        path: |
          ${{ runner.temp }}/work/*.out
          ${{ runner.temp }}/work/*/*.log
          ${{ runner.temp }}/work/*/*/*.executed.ipynb
