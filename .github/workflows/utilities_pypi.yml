name: utilities_pypi

# Publish the ncrystal-notebook-utilities package (in utilities/) to PyPI. Runs
# only when started by hand (the "Run workflow" button on the Actions page),
# after bumping the version in utilities/pyproject.toml.
#
# Uses PyPI's trusted publishing, so no token is needed: the project on PyPI
# lists mctools/ncrystal-notebooks and this workflow (utilities_pypi.yml) as a
# trusted publisher. In other repositories (e.g. forks), the package is only
# built.

on:
  workflow_dispatch:

jobs:

  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Build the source package and the wheel
      run: |
        python -m pip install build twine
        python -m build --outdir dist utilities
        python -m twine check --strict dist/*
        ls -l dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: utilities-dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [ build ]
    if: github.repository == 'mctools/ncrystal-notebooks'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for trusted publishing
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: utilities-dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
